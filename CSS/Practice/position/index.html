<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .profile {
  position: relative; 
  display: inline-block;
}

.profile-pic {
  width: 150px;
  border-radius: 50%;
}

.number {
  position: absolute; 
  top: 10px;      
  right: 10px;         
  background: red;
  color: white;
  padding: 5px 8px;
  border-radius: 50%;
  font-size: 14px;
}

</style>
<body>
    <div class="profile">
  <img src="img_avatar3.png" alt="Profile" class="profile-pic">
  <span class="number">5</span>
</div>

</body>
</html>
