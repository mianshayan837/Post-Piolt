<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .tooltip {
  position: relative;
  display: inline-block;
  border-bottom: 1px dotted black;
  cursor: pointer;
}
    .tooltiptext{
visibility: hidden;
background-color: black;
color: white;
text-align: center;
  border-radius: 6px;
  padding: 5px 0;
  position: absolute;
  z-index: 1;
  width: 130px;
    }
    .tooltip:hover .tooltiptext{
        visibility: visible;
    }
</style>
<body>
    <div class="tooltip">Hover Me!
        <span class="tooltiptext">I am tooltip</span>
    </div>
</body>
</html>
