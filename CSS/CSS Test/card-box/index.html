<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .card-box{
        width: 300px;
        border: 1px solid #ccc;
        border-radius: 3px;
        box-shadow: 0px 8px 16px black;
        height: auto;
        padding: 10px;
    }
    img{
        max-width: 100%;
        height: auto;
        display: block;
        margin: auto;
    }
    button{
      
        background-color: blue;
        color: white;
    }
      button:hover{
        background-color: red;
       
    }
</style>
<body>
    <div class="card-box">
<img src="img_forest.jpg" alt="">
<h2>Forest-image</h2>
<p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Assumenda, dolore?</p>
<button>Click Me!</button>
    </div>
    <!-- Make a card box with:

Width: 300px

Border: 1px solid #ccc

Rounded corners (border-radius)

Shadow (box-shadow)

Some padding inside

Inside the card:

Add an image at the top (responsive)

A title (h2) below the image

A short paragraph of text

A button at the bottom (blue background, white text, turns red on hover) -->
</body>
</html>
